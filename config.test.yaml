# Test config - Gemini for graph (fast + cheap), OpenAI for rest
openai:
  api_key_env: OPENAI_API_KEY
gemini:
  api_key_env: GOOGLE_API_KEY
deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com

models:
  graph:
    provider: gemini
    model: gemini-2.5-pro
    max_context: 1000000
    thinking_enabled: true
    thinking_budget: -1
  scout:
    provider: openai
    model: gpt-4o-mini
    max_context: 128000
  strategist:
    provider: openai
    model: gpt-4o
    max_context: 128000
  finalize:
    provider: openai
    model: gpt-4o
  reporting:
    provider: openai
    model: gpt-4o
  lightweight:
    provider: openai
    model: gpt-4o-mini

context:
  max_tokens: 256000
  compression_threshold: 0.75

timeouts:
  request_seconds: 300

retries:
  max_attempts: 3
  backoff_min_seconds: 1
  backoff_max_seconds: 2
