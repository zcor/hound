# Hound SaaS Stack - Docker Compose Configuration
# Usage: docker-compose up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: hound-db
    # Increase max connections and shared buffers for concurrent workers
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    ports:
      - "127.0.0.1:5432:5432"  # Only expose to localhost
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hound_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hound}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hound-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hound}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Message Broker & Pub/Sub
  redis:
    image: redis:7
    container_name: hound-redis
    # Add password protection to prevent external attacks
    command: redis-server --requirepass ${REDIS_PASSWORD:-hound_redis_secret}
    ports:
      # Remapped 6379 -> 6380 on host (DATA box runs a host-native redis-server
      # on 6379 for unrelated workloads). Container-internal port stays 6379
      # so REDIS_URL / CELERY_* references inside the compose network are
      # unchanged.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - hound-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hound_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Server
  api:
    image: ${HOUND_APP_IMAGE:-hound-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hound-api
    command: uvicorn server.api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Database & Redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-hound}:${POSTGRES_PASSWORD:-hound_secret}@db:5432/${POSTGRES_DB:-hound}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      # LLM API Keys (needed by synchronous API report generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # firepan-vff: Claude Code subscription token. When set, the `claude` CLI
      # invoked by SingleAuditor reads this instead of ANTHROPIC_API_KEY, so
      # auditor runs bill against the Claude Max subscription (not API). Mint
      # via `claude setup-token` on a host with an active Max login.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HOUND_LLM_VERBOSE: ${HOUND_LLM_VERBOSE:-0}
      # GitHub Integration
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-firepan-ai}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      HOUND_ALLOWED_ORIGINS: ${HOUND_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      # Token encryption for GitHub OAuth tokens
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Admin Key
      HOUND_ADMIN_KEY: ${HOUND_ADMIN_KEY:-}
      # Session secret for SQLAdmin (required when HOUND_ADMIN_KEY is set)
      HOUND_SECRET_KEY: ${HOUND_SECRET_KEY:-}
      # Telegram Notifications
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # SendGrid / Lifecycle Emails
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@firepan.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Firepan Team}
      SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-support@firepan.com}
      SENDGRID_TEMPLATE_ID_DEFAULT: ${SENDGRID_TEMPLATE_ID_DEFAULT:-}
      API_BASE_URL: ${API_BASE_URL:-https://api.firepan.com}
      # x402 Agent Payments
      X402_ENABLED: ${X402_ENABLED:-false}
      X402_WALLET_ADDRESS: ${X402_WALLET_ADDRESS:-}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      X402_NETWORK: ${X402_NETWORK:-eip155:84532}
      X402_FREE_SCAN_DAILY_BUDGET_USD: ${X402_FREE_SCAN_DAILY_BUDGET_USD:-25}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID:-}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:-}
      # Stripe Billing
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVE_CONFIRMED: ${STRIPE_LIVE_CONFIRMED:-}
      # Hound Config
      HOUND_CONFIG: ${HOUND_CONFIG:-}
    volumes:
      - ./secrets:/secrets:ro
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hound-net
    restart: unless-stopped

  # Celery Worker
  worker:
    image: ${HOUND_APP_IMAGE:-hound-app:local}
    container_name: hound-worker
    command: celery -A worker.tasks worker --loglevel=info -Q default,audits,scans
    environment:
      # Python path for project imports
      PYTHONPATH: /app
      # Database & Redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-hound}:${POSTGRES_PASSWORD:-hound_secret}@db:5432/${POSTGRES_DB:-hound}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # firepan-vff: Claude Code subscription token. When set, the `claude` CLI
      # invoked by SingleAuditor reads this instead of ANTHROPIC_API_KEY, so
      # auditor runs bill against the Claude Max subscription (not API). Mint
      # via `claude setup-token` on a host with an active Max login.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # LLM Debugging - set HOUND_LLM_VERBOSE=1 in .env to see prompts/responses
      HOUND_LLM_VERBOSE: ${HOUND_LLM_VERBOSE:-0}
      # GitHub Integration
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Admin Key
      HOUND_ADMIN_KEY: ${HOUND_ADMIN_KEY:-}
      HOUND_SECRET_KEY: ${HOUND_SECRET_KEY:-}
      # S3/MinIO Storage (optional)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      # Hound Config
      HOUND_CONFIG: ${HOUND_CONFIG:-}
      # Telegram Notifications (needed for funnel digest task)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # SendGrid / Lifecycle Emails (needed for DEEP_AUDIT_DONE + retry task)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@firepan.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Firepan Team}
      SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-support@firepan.com}
      SENDGRID_TEMPLATE_ID_DEFAULT: ${SENDGRID_TEMPLATE_ID_DEFAULT:-}
      API_BASE_URL: ${API_BASE_URL:-https://api.firepan.com}
      # firepan-pr80 — Archive RPC for mode=verify fork-based exploit tests.
      # Without this, forge's `vm.envOr("ETH_RPC_URL", "https://eth.llamarpc.com")`
      # falls back to the public llamarpc endpoint which 503s under load —
      # and Claude writes synthetic tests against vanilla EVM helpers instead
      # of the deployed protocol. Verified live on smokes 4-7: every "empirical
      # fail-safe verdict" we produced was actually a placebo because the fork
      # never instantiated. ETH_RPC_URL must be set in /opt/hound/.env.
      ETH_RPC_URL: ${ETH_RPC_URL:-}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # IMPORTANT: mount the DIRECTORY, not the file. Docker single-file
      # bind mounts pin the host inode at container start; any replace
      # (rsync, scp, cat >) creates a new inode on the host that the
      # container never sees, so the reader saw stale data forever.
      # Directory mounts don't have this problem — writes to files inside
      # the mounted dir are visible immediately.
      - ./state:/config/state:ro
      # firepan-vff: writable hypotheses volume so SingleAuditor's on-disk
      # HypothesisStore JSON survives the container lifecycle. Auditor-only
      # properties (numeric_gap_measurement, fp_check_verdict, negative_poc,
      # etc.) don't survive DB persist (no `properties` column on Hypothesis),
      # so eval / postmortem must read them from this volume.
      - ./hypotheses:/app/hypotheses
      # Local audit sources. DATA box only. Lets us point hound at /audits/<repo>
      # for local repos that aren't on GitHub. Writable because hound creates
      # `.hound_project_<scan_id>/` next to the source for graphs + manifest.
      - /home/assune/audits:/audits
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hound-net
    restart: unless-stopped

  # Celery Beat Scheduler
  beat:
    image: ${HOUND_APP_IMAGE:-hound-app:local}
    container_name: hound-beat
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-hound}:${POSTGRES_PASSWORD:-hound_secret}@db:5432/${POSTGRES_DB:-hound}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-hound_redis_secret}@redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # SendGrid / Lifecycle Emails (beat dispatches lifecycle tick, worker executes)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@firepan.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Firepan Team}
      SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-support@firepan.com}
      SENDGRID_TEMPLATE_ID_DEFAULT: ${SENDGRID_TEMPLATE_ID_DEFAULT:-}
      API_BASE_URL: ${API_BASE_URL:-https://api.firepan.com}
      HOUND_SECRET_KEY: ${HOUND_SECRET_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hound-net
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    image: ${HOUND_FRONTEND_IMAGE:-hound-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: hound-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api
    networks:
      - hound-net
    restart: unless-stopped

networks:
  hound-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
